version: "3.9"

services:
  # Next.js сайт (panfilov.consulting)
  app:
    container_name: panfilov-consulting
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
      - PORT=3002
      - HOSTNAME=0.0.0.0
    networks:
      - panfilov
    labels:
      - traefik.enable=true
      - traefik.http.routers.panfilov-consulting.rule=Host(`panfilov.consulting`)
      - traefik.http.routers.panfilov-consulting.entrypoints=websecure
      - traefik.http.routers.panfilov-consulting.tls.certresolver=le
      - traefik.http.services.panfilov-consulting.loadbalancer.server.port=3002

networks:
  # Per-app network; Traefik (file provider) joins it to route panfilov.consulting.
  panfilov:
    external: true
